services:
  - type: web
    name: ai-naming-platform
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: DOUBAO_API_KEY
        sync: false
      - key: DOUBAO_MODEL
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_MODEL
        sync: false
      - key: QWEN_API_KEY
        sync: false
      - key: QWEN_MODEL
        sync: false
      - key: KIMI_API_KEY
        sync: false
      - key: KIMI_MODEL
        sync: false
