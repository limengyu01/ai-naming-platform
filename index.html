<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 起名平台 · 李梦宇</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      padding: 24px 16px;
    }
    .container { max-width: 720px; margin: 0 auto; }
    h1 { text-align: center; color: #1a1a2e; margin-bottom: 20px; }
    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      padding: 20px;
      margin-bottom: 18px;
    }
    .row { display: flex; gap: 10px; flex-wrap: wrap; }
    textarea, select, button {
      font-size: 15px;
      border-radius: 8px;
      outline: none;
    }
    textarea {
      width: 100%;
      min-height: 76px;
      padding: 12px 14px;
      border: 1px solid #ddd;
      resize: vertical;
    }
    select {
      padding: 10px 12px;
      border: 1px solid #ddd;
      background: #fff;
      cursor: pointer;
    }
    button {
      padding: 10px 22px;
      border: none;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      cursor: pointer;
      white-space: nowrap;
    }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .options { margin-top: 12px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .output {
      margin-top: 16px;
      padding: 16px;
      border-radius: 10px;
      background: #fafafa;
      min-height: 120px;
      white-space: pre-wrap;
      line-height: 1.8;
      color: #222;
    }
    .empty { color: #999; text-align: center; padding: 32px 0; }
    .history-item {
      border-bottom: 1px solid #f0f0f0;
      padding: 12px 0;
    }
    .history-item:last-child { border-bottom: none; }
    .meta { font-size: 13px; color: #666; margin-bottom: 6px; }
    .result { font-size: 14px; color: #333; white-space: pre-wrap; }
  </style>
</head>
<body>
  <div class="container">
    <h1>AI 起名平台</h1>

    <div class="card">
      <textarea id="requirement" placeholder="输入起名需求，例如：男孩、国风、简约、有志向"></textarea>
      <div class="options">
        <label>模型
          <select id="model">
            <option value="doubao">豆包（火山方舟）</option>
            <option value="deepseek">DeepSeek</option>
            <option value="qwen">通义千问</option>
            <option value="kimi">Kimi</option>
          </select>
        </label>
        <label>风格
          <select id="style">
            <option value="国风">国风</option>
            <option value="现代简约">现代简约</option>
            <option value="英文名字">英文名字</option>
          </select>
        </label>
        <button id="generateBtn">生成名字</button>
      </div>
      <div id="output" class="output"><div class="empty">请输入需求并选择模型，生成 3 组名字和寓意。</div></div>
    </div>

    <div class="card">
      <h2 style="font-size:18px;margin-bottom:12px;">历史记录</h2>
      <div id="history"><div class="empty">暂无历史记录</div></div>
    </div>
  </div>

  <script>
    const requirementInput = document.getElementById('requirement');
    const modelSelect = document.getElementById('model');
    const styleSelect = document.getElementById('style');
    const generateBtn = document.getElementById('generateBtn');
    const output = document.getElementById('output');
    const historyBox = document.getElementById('history');

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str || '';
      return div.innerHTML;
    }

    async function loadHistory() {
      try {
        const res = await fetch('/api/history');
        const data = await res.json();
        const rows = data.data || [];
        if (!rows.length) {
          historyBox.innerHTML = '<div class="empty">暂无历史记录</div>';
          return;
        }
        historyBox.innerHTML = rows.map(item => `
          <div class="history-item">
            <div class="meta">${escapeHtml(item.created_at || '')} · 模型：${escapeHtml(item.model_name)}</div>
            <div class="meta">需求：${escapeHtml(item.user_requirement)}</div>
            <div class="result">${escapeHtml(item.name_result)}</div>
          </div>`).join('');
      } catch (e) {
        historyBox.innerHTML = `<div class="empty">历史记录加载失败：${escapeHtml(e.message)}</div>`;
      }
    }

    async function generate() {
      const requirement = requirementInput.value.trim();
      if (!requirement) {
        output.innerHTML = '<div class="empty">请先输入起名需求</div>';
        return;
      }

      generateBtn.disabled = true;
      output.textContent = '';

      try {
        const res = await fetch('/api/name', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            requirement,
            model: modelSelect.value,
            style: styleSelect.value
          })
        });

        if (!res.ok) {
          const err = await res.json().catch(() => ({ error: '请求失败' }));
          output.textContent = err.error || '请求失败';
          return;
        }

        const reader = res.body.getReader();
        const decoder = new TextDecoder('utf-8');
        let buffer = '';
        let hasContent = false;

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n');
          buffer = lines.pop() || '';

          for (const line of lines) {
            const trimmed = line.trim();
            if (!trimmed.startsWith('data:')) continue;
            const data = trimmed.slice(5).trim();
            if (data === '[DONE]') continue;

            try {
              const json = JSON.parse(data);
              if (json.error) {
                output.textContent = json.error;
                return;
              }
              if (json.content) {
                hasContent = true;
                output.textContent += json.content;
              }
            } catch (e) {
              console.error(e);
            }
          }
        }

        if (!hasContent) output.textContent = '模型没有返回内容，请更换模型或检查环境变量。';
        loadHistory();
      } catch (e) {
        output.textContent = `生成失败：${e.message}`;
      } finally {
        generateBtn.disabled = false;
      }
    }

    generateBtn.addEventListener('click', generate);
    requirementInput.addEventListener('keydown', e => {
      if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) generate();
    });

    loadHistory();
  </script>
</body>
</html>
